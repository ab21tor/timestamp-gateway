services:
  gateway:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      - tor
    networks:
      - ts_net
    # Persistent state: the durable obligation log (obligations.db) and the
    # operator PAUSED switch live under /var/lib/timestamp-gateway. This volume
    # must survive container recreation or a settled-but-unstamped obligation
    # could be lost. See OBLIGATIONS_DB_PATH in .env.example.
    volumes:
      - gateway_data:/var/lib/timestamp-gateway
    # Uncomment to expose the gateway on clearnet in addition to the onion address:
    # ports:
    #   - "8000:8000"

  tor:
    build: ./tor
    volumes:
      - tor_keys:/var/lib/tor
    restart: unless-stopped
    networks:
      - ts_net
    # Uncomment to expose the Tor SOCKS proxy on the host (useful for local debugging):
    # ports:
    #   - "127.0.0.1:9050:9050"

  # ── OTS calendar backend (otsd) ────────────────────────────────────────────
  # The operator-controlled OpenTimestamps calendar server.
  # This is the proof engine. The gateway is the paid front door to this service.
  #
  # Usage:
  #   docker compose --profile calendar up -d
  #
  # Or point OTS_CALENDAR_URL at an external otsd instance and omit this service.
  #
  # otsd requires access to a Bitcoin Core node (RPC) and a wallet with funds
  # to pay for on-chain anchoring transactions. See docs/operator-guide.md.
  #
  # otsd is NOT publicly exposed. On the calendar profile it runs with host
  # networking and binds loopback only; the gateway reaches it on
  # 127.0.0.1:14788.
  otsd:
    build: ./otsd
    profiles: ["calendar"]
    restart: unless-stopped
    # Host networking: otsd reaches Bitcoin RPC via the socat/Tor bridge
    # on 127.0.0.1:18332; the gateway reaches otsd on 127.0.0.1:14788
    # (set OTS_CALENDAR_URL=http://127.0.0.1:14788 when using this profile).
    network_mode: host
    volumes:
      - /var/lib/otsd/calendar:/calendar
      # Calendar code: your opentimestamps-server fork checkout.
      - ${OTSD_FORK_PATH:-./opentimestamps-server}:/app
    environment:
      # Full RPC URL including credentials. Set in gitignored .env ONLY.
      # Compose fails loud if unset.
      - BITCOIN_RPC_SERVICE_URL=${BITCOIN_RPC_SERVICE_URL:?set in .env}

networks:
  ts_net:
    driver: bridge

volumes:
  tor_keys:
  gateway_data:
