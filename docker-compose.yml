# Scope: this file is the Docker-only deployment path — gateway + tor, plus
# the operator-controlled OTS calendar (otsd) via --profile calendar and an
# optional Tor bridge to an onion Bitcoin node via --profile onion-rpc.
#
# It does NOT run:
#   - phoenixd — the Lightning wallet holding your funds is external by
#     design; point PHOENIXD_URL at it (http://host.docker.internal:9740
#     when it runs on this host).
#   - a Bitcoin Core node — otsd needs BITCOIN_RPC_SERVICE_URL reachable
#     from its container (LAN node, host node via host.docker.internal, or
#     an onion node via --profile onion-rpc).
#   - the ops/ alarm timers (systemd) — without them /health reports
#     wallet/proofs/backup as "absent": reported, not degraded. To run them
#     on this host alongside compose, see GATEWAY_STATE_DIR below.
#
# The reference production deployment runs the gateway under systemd
# instead; both paths are documented in docs/operator-guide.md.

# Bounded container logs for every service: without this, the json-file
# driver keeps every line until the container is recreated — an unbounded,
# unrotated record (the otsd log includes per-request lines).
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    build: .
    # An explicit allowlist, never `env_file: .env`: the whole file would
    # give the internet-facing gateway container the otsd wallet's Bitcoin
    # RPC URL and password. Each
    # line is interpolated from .env; a name absent there arrives as the
    # empty string, which the gateway reads as unset (main.py, _env). What
    # is NOT here never reaches the container: BITCOIN_RPC_SERVICE_URL and
    # BITCOIN_RPC_ONION (otsd's and the bridge's), the ops/ timer settings
    # (WALLET_*, BACKUP_*, NTFY_URL, HEALTH_*), the compose-level paths
    # (GATEWAY_STATE_DIR, OTSD_*). test_review_compose_gateway_environment_
    # is_an_allowlist in test_main.py resolves this file with dummy values
    # and checks both directions: every variable main.py reads is listed,
    # and the RPC credential is in otsd's environment only. (The retired
    # pricing and billing names main.py warns about are deliberately absent:
    # under compose they cannot reach the process, so that warning never
    # fires. The two retired names whose old values are REFUSED stay listed,
    # see L402_ENABLED and OTS_BACKEND_MODE below.)
    environment:
      # Retired and kept here for the same reason as L402_ENABLED below:
      # an explicit `public` is refused at startup.
      - OTS_BACKEND_MODE=${OTS_BACKEND_MODE-}
      - OTS_CALENDAR_URL=${OTS_CALENDAR_URL-}
      - OTS_SUBMIT_MAX_ATTEMPTS=${OTS_SUBMIT_MAX_ATTEMPTS-}
      - OTS_SUBMIT_BACKOFF_SECONDS=${OTS_SUBMIT_BACKOFF_SECONDS-}
      # Retired and kept in the allowlist on purpose: an explicitly
      # configured false is refused at startup with
      # a migration diagnostic, and a value that never reached the process
      # could not be refused (a free door must never silently turn paid).
      - L402_ENABLED=${L402_ENABLED-}
      - PRICE_PER_PROOF_SATS=${PRICE_PER_PROOF_SATS-}
      - L402_SECRET_HEX=${L402_SECRET_HEX-}
      - L402_ALLOW_EPHEMERAL_SECRET=${L402_ALLOW_EPHEMERAL_SECRET-}
      - L402_TOKEN_EXPIRY_SECONDS=${L402_TOKEN_EXPIRY_SECONDS-}
      - PAYMENT_BACKEND_TYPE=${PAYMENT_BACKEND_TYPE-}
      - PHOENIXD_URL=${PHOENIXD_URL-}
      - PHOENIXD_HTTP_PASSWORD_LIMITED=${PHOENIXD_HTTP_PASSWORD_LIMITED-}
      - PHOENIXD_HTTP_PASSWORD=${PHOENIXD_HTTP_PASSWORD-}
      - PAUSE_FILE=${PAUSE_FILE-}
      - OBLIGATIONS_DB_PATH=${OBLIGATIONS_DB_PATH-}
      - OBLIGATION_SWEEP_INTERVAL=${OBLIGATION_SWEEP_INTERVAL-}
      - STAMPER_FEE_CAP_SATS=${STAMPER_FEE_CAP_SATS-}
      - WALLET_STATUS_PATH=${WALLET_STATUS_PATH-}
      - WALLET_STATUS_MAX_AGE_SECONDS=${WALLET_STATUS_MAX_AGE_SECONDS-}
      - PROOFS_STATUS_PATH=${PROOFS_STATUS_PATH-}
      - PROOFS_STATUS_MAX_AGE_SECONDS=${PROOFS_STATUS_MAX_AGE_SECONDS-}
      - BACKUP_STATUS_PATH=${BACKUP_STATUS_PATH-}
      - BACKUP_STATUS_MAX_AGE_SECONDS=${BACKUP_STATUS_MAX_AGE_SECONDS-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE-}
      - VERIFY_RATE_LIMIT_PER_MINUTE=${VERIFY_RATE_LIMIT_PER_MINUTE-}
      - HEALTH_PROBE_CACHE_SECONDS=${HEALTH_PROBE_CACHE_SECONDS-}
      - GATEWAY_BEHIND_PROXY=${GATEWAY_BEHIND_PROXY-}
      - UPGRADE_CLIENT_TOKEN=${UPGRADE_CLIENT_TOKEN-}
    logging: *bounded-logging
    restart: unless-stopped
    depends_on:
      - tor
    networks:
      - ts_net
    # host.docker.internal = this Docker host — how the container reaches
    # host services (phoenixd). Caveat: on Docker Desktop (macOS/Windows)
    # this reaches loopback-bound host services via the VM proxy; on a
    # Linux engine it maps to a bridge IP, so a phoenixd bound to
    # 127.0.0.1 (its default) is NOT reachable — bind it where the
    # container can reach it (see PHOENIXD_URL in .env.example).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Persistent state: the durable obligation log (obligations.db), the
    # operator PAUSED switch and the ops status files live under
    # /var/lib/timestamp-gateway. This mount must survive container
    # recreation or a settled-but-unstamped obligation could be lost.
    # Default: named volume. Operators running the ops/ systemd timers on
    # this host set GATEWAY_STATE_DIR=/var/lib/timestamp-gateway in .env so
    # the status files the timers write are the ones /health reads.
    volumes:
      - ${GATEWAY_STATE_DIR:-gateway_data}:/var/lib/timestamp-gateway
    # Loopback-only publish: reachable from this host (curl, ops scripts,
    # the health monitor) but not from the network — Tor is the public
    # front door. For clearnet exposure change to "8000:8000" and see
    # "Clearnet exposure" in the operator guide.
    ports:
      - "127.0.0.1:8000:8000"

  tor:
    build: ./tor
    volumes:
      - tor_keys:/var/lib/tor
    logging: *bounded-logging
    restart: unless-stopped
    networks:
      - ts_net
    # Uncomment to expose the Tor SOCKS proxy on the host (useful for local debugging):
    # ports:
    #   - "127.0.0.1:9050:9050"

  # OTS calendar backend (otsd): docker compose --profile calendar up -d
  # The operator-controlled OpenTimestamps calendar server, which the
  # gateway fronts.
  # Or point OTS_CALENDAR_URL at an external otsd instance and omit this
  # profile.
  #
  # The image is Python + dependencies ONLY. The calendar CODE is the
  # opentimestamps-server fork mounted at /app: clone it and set
  # OTSD_FORK_PATH in .env (default: a checkout next to this repo). Clone
  # command and branch: operator guide, "Deploying the calendar (otsd)".
  #
  # First run only — otsd refuses to start until its calendar identity
  # exists (three files: uri, hmac-key, donation_addr). Creation command:
  # operator guide, "Deploying the calendar (otsd)".
  #
  # otsd is NOT publicly exposed: no published port; the gateway reaches it
  # at http://otsd:14788 on the compose network (OTS_CALENDAR_URL).
  otsd:
    build:
      context: ./otsd
      additional_contexts:
        fork: ${OTSD_FORK_PATH:-../opentimestamps-server}
    profiles: ["calendar"]
    logging: *bounded-logging
    restart: unless-stopped
    networks:
      - ts_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # --rpc-address 0.0.0.0: reachable on the compose network (unpublished);
    # the image default binds localhost for non-compose runs.
    # --btc-max-fee takes BTC (0.0002 BTC = 20,000 sats — never "fix" it to
    # 20000); cap semantics: operator guide, "Bitcoin transaction cost".
    # No -v: INFO is the production level — DEBUG ships commitment hexes and
    # wallet outpoints into the container log.
    command: ["python", "/app/otsd", "--rpc-address", "0.0.0.0", "--calendar", "/calendar", "--btc-conf-target", "12", "--btc-max-fee", "0.0002"]
    # otsd's clean-exit path hangs off KeyboardInterrupt — SIGINT, not the
    # compose-default SIGTERM, is what actually runs it.
    stop_signal: SIGINT
    stop_grace_period: 30s
    volumes:
      # Calendar state — the proof namespace. Destroying it strands every
      # pending proof this calendar has issued. Default: named volume; set
      # OTSD_CALENDAR_DIR to a host path to manage it yourself.
      - ${OTSD_CALENDAR_DIR:-otsd_calendar}:/calendar
      # Calendar code: the fork checkout (see above).
      - ${OTSD_FORK_PATH:-../opentimestamps-server}:/app
    environment:
      # Full RPC URL including credentials. Set in gitignored .env ONLY.
      # Unset -> otsd exits at startup with a clear error. Runtime
      # fail-loud, deliberately not ${VAR:?}: parse-time errors here would
      # break every compose command for operators not using this profile.
      - BITCOIN_RPC_SERVICE_URL=${BITCOIN_RPC_SERVICE_URL:-}

  # socat bridge to an onion Bitcoin node: --profile onion-rpc
  # For operators whose Bitcoin node exposes RPC as a Tor onion service
  # (Start9 and self-hosted-over-Tor setups — the reference deployment's
  # own shape). Forwards rpc-bridge:18332 on the compose network to your
  # node's onion RPC through the tor service. Set BITCOIN_RPC_ONION in .env
  # and point BITCOIN_RPC_SERVICE_URL at
  # http://<user>:<password>@rpc-bridge:18332/... — the systemd-path
  # equivalent is deploy/socat-bitcoin-rpc.service.example.
  rpc-bridge:
    build: ./tor
    profiles: ["onion-rpc"]
    logging: *bounded-logging
    restart: unless-stopped
    depends_on:
      - tor
    networks:
      - ts_net
    command: ["socat", "TCP-LISTEN:18332,fork,reuseaddr,keepalive", "SOCKS4A:tor:${BITCOIN_RPC_ONION:-}:8332,socksport=9050"]

networks:
  ts_net:
    driver: bridge

volumes:
  tor_keys:
  gateway_data:
  otsd_calendar:
